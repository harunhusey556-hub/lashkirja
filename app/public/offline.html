<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LashKirja ei latautunut</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f3ef;
        color: #26221f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #6a645f;
      }
      button {
        margin-top: 1.25rem;
        min-height: 48px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 14px;
        background: #26221f;
        color: #f6f3ef;
        font-weight: 600;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sovellusta ei saatu ladattua</h1>
      <p>
        Yhteys LashKirjaan epäonnistui. Tarkista verkko ja yritä uudelleen.
        Asennettu sovellus näyttää tämän sivun, kun etäosoite ei vastaa.
      </p>
      <button type="button" onclick="location.reload()">Yritä uudelleen</button>
    </main>
  </body>
</html>
