<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The real server URL, baked in at `cap sync` time by
      scripts/patch-ios-offline-server.ts into the synced copy under
      ios/App/App/public/offline.html. Left empty in the source copy under
      app/public/ (there is no server URL to bake in outside a build).

      A meta tag was chosen over reading window.Capacitor's own config: this
      page is loaded by the native shell's errorPath, a plain
      capacitor://localhost/offline.html document load that is NOT part of
      the app's normal navigation, so relying on undocumented bridge
      globals being initialised on an error page is not something to trust.
      A meta tag baked in at sync time (the same mechanism already used for
      the lashkirja:// URL scheme) is simple, inspectable in the shipped
      bundle, and needs no bridge at all.
    -->
    <meta name="lashkirja-server" content="" />
    <title>LashKirja ei latautunut</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f3ef;
        color: #26221f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #6a645f;
      }
      button {
        margin-top: 1.25rem;
        min-height: 48px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 14px;
        background: #26221f;
        color: #f6f3ef;
        font-weight: 600;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Yhteys palvelimeen ei onnistunut</h1>
      <p>
        LashKirjaan ei juuri nyt saada yhteyttä. Sovellus yrittää
        automaattisesti uudelleen. Voit myös yrittää itse tai tarkistaa
        verkkoyhteytesi.
      </p>
      <button type="button" id="retry-button">Yritä uudelleen</button>
    </main>
    <script>
      (function () {
        "use strict";
        // The splash stays up (launchAutoHide: false) until the web app calls
        // hide() itself. If the remote page never loaded, that call never
        // happens from there, so this page -- the native errorPath shown on a
        // genuine load failure -- must call it too, or the splash would sit
        // on top of this self-healing screen forever. Capacitor injects its
        // JS bridge into every page this WKWebView loads, including a local
        // errorPath document, so the same window.Capacitor global used by
        // src/lib/splash.ts is available here without a bundler.
        try {
          if (
            window.Capacitor &&
            window.Capacitor.Plugins &&
            window.Capacitor.Plugins.SplashScreen
          ) {
            window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 200 });
          }
        } catch (e) {
          // No bridge (opened outside a real build) - nothing to hide.
        }

        var STORAGE_KEY = "lashkirja-offline-retry-attempt";
        // If the last recorded attempt is older than this, treat it as a
        // new outage rather than a continuation of a previous one. Without
        // this, sessionStorage on capacitor://localhost survives the trip
        // back to the server once reconnected, so a second, unrelated
        // outage later in the same app session would start at the steady
        // 15s gap instead of retrying immediately (final review M5).
        var RESET_AFTER_MS = 60000;
        var meta = document.querySelector('meta[name="lashkirja-server"]');
        var serverUrl = meta && meta.content ? meta.content.replace(/\/+$/, "") : "";
        var target = serverUrl ? serverUrl + "/dashboard" : null;

        function clearAttemptCount() {
          try {
            sessionStorage.removeItem(STORAGE_KEY);
          } catch (e) {
            // No storage available - every load just looks like attempt 0.
          }
        }

        var button = document.getElementById("retry-button");
        if (button) {
          button.addEventListener("click", function () {
            if (!target) return;
            // A manual retry is not part of the automatic backoff: it
            // always fires now, and if it also fails the next automatic
            // load starts the backoff over from "immediate" again.
            clearAttemptCount();
            location.replace(target);
          });
        }

        // No server URL was baked in (e.g. this file was opened outside a
        // real build). Nothing to auto-retry against; the button above is
        // a no-op guard, not a crash.
        if (!target) return;

        // Capacitor 8.5 reloads this exact page fresh on ANY failed
        // navigation, including one this script starts itself - so a
        // failed automatic retry does not leave this script running to
        // count its own next delay. The attempt number survives across
        // that reload in sessionStorage (same WKWebView, same origin) so
        // the delay before the Nth retry keeps climbing instead of every
        // reload restarting at "immediate".
        //
        // Gaps before the 1st (immediate), 2nd, 3rd and 4th automatic
        // retries; every one after that waits the steady 15s gap.
        var GAPS = [0, 2000, 5000, 10000];
        var STEADY_GAP_MS = 15000;
        // When sessionStorage throws (private mode, full, disabled), there
        // is no way to count attempts across the reload Capacitor does on
        // every failed navigation, so readState() always reports attempt 0
        // -- retrying at the GAPS[0] === 0ms delay forever, a hot reload
        // loop against a dead server. Floor the delay instead whenever
        // storage is known to be unavailable.
        var NO_STORAGE_FLOOR_MS = 2000;
        var storageAvailable = true;

        function readState() {
          try {
            var raw = sessionStorage.getItem(STORAGE_KEY);
            if (raw === null) return { attempt: 0 };
            var parsed = JSON.parse(raw);
            var at = typeof parsed.at === "number" ? parsed.at : 0;
            if (Date.now() - at > RESET_AFTER_MS) return { attempt: 0 };
            var attempt = typeof parsed.attempt === "number" && parsed.attempt >= 0 ? parsed.attempt : 0;
            return { attempt: attempt };
          } catch (e) {
            storageAvailable = false;
            return { attempt: 0 };
          }
        }

        function writeState(attempt) {
          try {
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ attempt: attempt, at: Date.now() }));
          } catch (e) {
            storageAvailable = false;
          }
        }

        function gapForAttempt(attempt) {
          if (!storageAvailable) return NO_STORAGE_FLOOR_MS;
          return attempt < GAPS.length ? GAPS[attempt] : STEADY_GAP_MS;
        }

        var attempt = readState().attempt;
        var gap = gapForAttempt(attempt);
        var timer = null;

        function fire() {
          writeState(attempt + 1);
          location.replace(target);
        }

        function schedule() {
          clearTimeout(timer);
          // A backgrounded page does not schedule; visibilitychange below
          // fires immediately and resumes the schedule once visible again.
          if (document.visibilityState !== "visible") return;
          timer = setTimeout(fire, gap);
        }

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") {
            schedule();
          } else {
            clearTimeout(timer);
          }
        });

        schedule();
      })();
    </script>
  </body>
</html>
