name: iOS native

on:
  push:
    branches: [native, "feature/**"]
    paths: ["ios-native/**", ".github/workflows/ios-native.yml"]
  # A pull request into native is built and tested before it is merged.
  pull_request:
    branches: [native]
    paths: ["ios-native/**", ".github/workflows/ios-native.yml"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS API base URL baked into the app"
        required: false
        default: "https://desktop-7gu8ukj.tail42feb1.ts.net:8443"

permissions:
  contents: read

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: swift test
        working-directory: ios-native/LashKirjaCore
        run: |
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # Compile errors and failed expectations become annotations, readable without a log download.
          grep -E "error:|✘" test.log | sed -E 's/\x1b\[[0-9;]*m//g' | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $status

  ios-build:
    name: iOS build and tests
    runs-on: macos-26
    needs: core-linux
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -version
      - name: Generate project
        working-directory: ios-native/App
        run: xcodegen generate
      - name: Build and test (simulator)
        working-directory: ios-native/App
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c 'import sys,json
          d=json.load(sys.stdin)["devices"]
          ids=[x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(ids[0] if ids else "")')
          echo "Simulator: $DEST"
          xcodebuild test -project LashKirja.xcodeproj -scheme LashKirja \
            -destination "id=$DEST" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen xcbeautify
      - name: Archive
        working-directory: ios-native/App
        env:
          API_URL: ${{ inputs.api_base_url || 'https://desktop-7gu8ukj.tail42feb1.ts.net:8443' }}
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project LashKirja.xcodeproj -scheme LashKirja -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            API_BASE_URL="$API_URL" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcbeautify --renderer github-actions
          # A Release IPA must talk to a real https server and carry a build number that names this run.
          PLIST=build/Build/Products/Release-iphoneos/LashKirja.app/Info.plist
          BASE=$(/usr/libexec/PlistBuddy -c "Print :LKAPIBaseURL" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "API base: $BASE, build: $BUILD"
          case "$BASE" in
            https://localhost*|https://127.*|https://0.0.0.0*|https://*.local*|https://invalid*) echo "::error::API base '$BASE' is a local or placeholder host"; exit 1 ;;
            https://*) ;;
            *) echo "::error::API base '$BASE' is not https"; exit 1 ;;
          esac
          [ "$BUILD" = "${{ github.run_number }}" ] || { echo "::error::CFBundleVersion '$BUILD' is not the run number"; exit 1; }
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/LashKirja.app Payload/
          zip -qry LashKirja-native-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LashKirja-native-unsigned-ipa
          path: ios-native/App/LashKirja-native-unsigned.ipa
          retention-days: 30
