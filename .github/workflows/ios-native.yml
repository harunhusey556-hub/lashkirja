name: iOS native

on:
  push:
    branches: [native, "feature/**"]
    paths: ["ios-native/**", ".github/workflows/ios-native.yml"]
  # A pull request into native is built and tested before it is merged.
  pull_request:
    branches: [native]
    paths: ["ios-native/**", ".github/workflows/ios-native.yml"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS API base URL baked into the app"
        required: false
        default: "https://desktop-7gu8ukj.tail42feb1.ts.net:8443"

permissions:
  contents: read

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 'Peruuta' is the cancel word everywhere: a short 'Peru' had slipped into three screens (X042).
      - name: No "Peru" buttons
        run: |
          if grep -rnF '"Peru"' ios-native/App/Sources ios-native/LashKirjaCore/Sources; then
            echo '::error::Use "Peruuta", not "Peru" (X042).'
            exit 1
          fi
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: swift test
        working-directory: ios-native/LashKirjaCore
        run: |
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # Compile errors and failed expectations become annotations, readable without a log download.
          grep -E "error:|✘" test.log | sed -E 's/\x1b\[[0-9;]*m//g' | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $status
      # 389 warnings sat in this log unseen (N002): one in the repo's own sources now fails the job.
      - name: No compiler warnings
        run: python3 scripts/compiler-warnings.py ios-native/LashKirjaCore/test.log

  ios-build:
    name: iOS build and tests
    runs-on: macos-26
    needs: core-linux
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -version
      - name: Generate project
        working-directory: ios-native/App
        run: xcodegen generate
      - name: Build and test (simulator)
        working-directory: ios-native/App
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c 'import sys,json
          d=json.load(sys.stdin)["devices"]
          ids=[x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(ids[0] if ids else "")')
          echo "Simulator: $DEST"
          echo "SIM_UDID=$DEST" >> "$GITHUB_ENV"
          # Ad-hoc signed, as the UI tests below: an unsigned simulator host has no Keychain, and
          # KeychainTokenStoreTests skipped on every run (N001). LK_REQUIRE_KEYCHAIN makes the test
          # fail instead of skip when the host still has none.
          TEST_RUNNER_LK_REQUIRE_KEYCHAIN=1 xcodebuild test -project LashKirja.xcodeproj -scheme LashKirja \
            -destination "id=$DEST" -derivedDataPath build -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO | tee xcodebuild.log | xcbeautify --renderer github-actions
      # xcbeautify drops the file and line of a warning; the raw log names them (N002).
      - name: No compiler warnings
        run: python3 scripts/compiler-warnings.py ios-native/App/xcodebuild.log
      # N001: the only unit test that skipped here was the Keychain round trip, so any skip means
      # the Keychain tests did not run. The test's own skip stays for a host that has no Keychain.
      - name: Unit tests ran, none skipped
        working-directory: ios-native/App
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact > unit-summary.json
          python3 - unit-summary.json <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          skipped = s.get("skippedTests", 0)
          print(f"Unit tests: {s.get('totalTestCount', 0)} total, {s.get('passedTests', 0)} passed, {s.get('failedTests', 0)} failed, {skipped} skipped")
          if s.get("totalTestCount", 0) == 0 or skipped:
              print(f"::error::{skipped} unit test(s) skipped, or none ran: KeychainTokenStoreTests must run on the ad-hoc signed host (N001)")
              sys.exit(1)
          PY
      # The owner's screens (OwnerScreensTests) are driven against a throwaway demo API on this
      # runner's loopback, as docs/quality/SIMULATOR.md does by hand: a fresh SQLite file, the demo
      # seed, no cloud AI, no mail. Nothing here reaches a real server.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Demo API for the UI tests
        working-directory: app
        env:
          DATABASE_URL: "file:${{ github.workspace }}/app/ui-demo.db"
          SESSION_SECRET: "ci-only-secret-not-used-anywhere-real-32plus"
          CLOUD_AI_ENABLED: "false"
          ENABLEBANKING_ENABLED: "false"
          MAIL_TRANSPORT: "json"
        run: |
          set -euo pipefail
          npm ci
          npx prisma generate
          rm -f ui-demo.db
          npx prisma migrate deploy
          npx tsx scripts/demo-seed.ts --ci
          # The seed's receipts name files that do not exist. Each gets a real picture, stored the way
          # an upload is (data/uploads/<user>/<uuid>.jpg), so Kuitit has thumbnails to show.
          DB=ui-demo.db
          U=$(sqlite3 "$DB" "SELECT id FROM User WHERE email='demo@lashkirja.fi'")
          mkdir -p "data/uploads/$U" "$RUNNER_TEMP/jpegs"
          sqlite3 -separator $'\t' "$DB" "SELECT id, vendor, totalAmountCents FROM Receipt WHERE userId='$U'" > "$RUNNER_TEMP/receipts.tsv"
          cat > "$RUNNER_TEMP/receipt-jpegs.swift" <<'SWIFT'
          import AppKit
          // Reads "<id>\t<vendor>\t<cents>" lines; writes <out>/<id>.jpg, a plain receipt picture per row.
          let out = CommandLine.arguments[1]
          while let line = readLine() {
              let field = line.components(separatedBy: "\t")
              guard field.count == 3 else { continue }
              guard let rep = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: 600, pixelsHigh: 800, bitsPerSample: 8,
                                               samplesPerPixel: 4, hasAlpha: true, isPlanar: false, colorSpaceName: .deviceRGB,
                                               bytesPerRow: 0, bitsPerPixel: 0) else { fatalError("no bitmap") }
              NSGraphicsContext.saveGraphicsState()
              NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
              NSColor.white.setFill()
              NSRect(x: 0, y: 0, width: 600, height: 800).fill()
              let euros = String(format: "%.2f", (Double(field[2]) ?? 0) / 100).replacingOccurrences(of: ".", with: ",")
              let font = NSFont.monospacedSystemFont(ofSize: 34, weight: .bold)
              for (index, text) in [field[1].uppercased(), "", "KUITTI", "", "YHTEENSÄ", "\(euros) EUR"].enumerated() {
                  (text as NSString).draw(at: NSPoint(x: 40, y: 700 - index * 64), withAttributes: [.font: font, .foregroundColor: NSColor.black])
              }
              NSGraphicsContext.restoreGraphicsState()
              guard let jpeg = rep.representation(using: .jpeg, properties: [.compressionFactor: 0.85]) else { fatalError("no jpeg") }
              try jpeg.write(to: URL(fileURLWithPath: "\(out)/\(field[0]).jpg"))
          }
          SWIFT
          xcrun swift "$RUNNER_TEMP/receipt-jpegs.swift" "$RUNNER_TEMP/jpegs" < "$RUNNER_TEMP/receipts.tsv"
          while IFS=$'\t' read -r id vendor cents; do
            key="$(uuidgen | tr 'A-Z' 'a-z').jpg"
            install -m 600 "$RUNNER_TEMP/jpegs/$id.jpg" "data/uploads/$U/$key"
            echo "UPDATE Receipt SET filePath='$key' WHERE id='$id';"
          done < "$RUNNER_TEMP/receipts.tsv" | sqlite3 "$DB"
          echo "Receipts with a picture: $(sqlite3 "$DB" "SELECT count(*) FROM Receipt WHERE filePath LIKE '%.jpg'")"
          npm run build
          nohup npx next start -H 127.0.0.1 -p 3999 > api-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null "http://127.0.0.1:3999/login"; then break; fi
            sleep 1
          done
          curl -s -o /dev/null -w "GET /login -> %{http_code}\n" "http://127.0.0.1:3999/login"
      - name: UI tests (owner's screens, simulator)
        working-directory: ios-native/App
        run: |
          set -o pipefail
          SH="$PWD/ui-shots"
          mkdir -p "$SH"
          # Screenshots go into the result bundle (XCTAttachment); this host watcher also answers the
          # tests' shot() requests with simctl, as scripts/sim/run-ui.sh does on the Mac.
          ( shopt -s nullglob
            while true; do
              for r in "$SH"/*.req; do xcrun simctl io "$SIM_UDID" screenshot "${r%.req}.png" >/dev/null 2>&1; rm -f "$r"; done
              sleep 0.3
            done ) &
          W=$!
          trap 'kill $W 2>/dev/null' EXIT
          # Ad-hoc signed: an unsigned simulator build cannot use the Keychain, so sign-in would fail.
          TEST_RUNNER_LK_SHOT_DIR="$SH" xcodebuild test -project LashKirja.xcodeproj -scheme LashKirja-UITests \
            -destination "id=$SIM_UDID" -derivedDataPath build \
            -only-testing:LashKirjaUITests/OwnerScreensTests -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            API_BASE_URL=http://127.0.0.1:3999 | xcbeautify --renderer github-actions
      - name: Export UI screenshots
        if: always()
        working-directory: ios-native/App
        run: |
          mkdir -p ui-attachments/named
          if [ -d UITestResults.xcresult ]; then
            if xcrun xcresulttool export attachments --path UITestResults.xcresult --output-path ui-attachments; then
              # manifest.json names each exported file; a copy under its step name is easier to browse.
              python3 - ui-attachments <<'PY' || echo "::warning::could not name the exported attachments"
          import json, os, re, shutil, sys
          root = sys.argv[1]
          for test in json.load(open(os.path.join(root, "manifest.json"))):
              for item in test.get("attachments", []):
                  source = os.path.join(root, item["exportedFileName"])
                  name = item.get("suggestedHumanReadableName") or item["exportedFileName"]
                  # XCTest's own recordings and snapshots stay in the .xcresult (ui-xcresult artifact).
                  if name.startswith(("Screen Recording", "Synthesized Event", "UI Snapshot", "App UI hierarchy", "Debug description")):
                      continue
                  if os.path.exists(source):
                      # upload-artifact refuses " : < > | * ? and newlines (NTFS-safe names).
                      safe = re.sub(r'[\\/":<>|*?\r\n`]', "_", name)
                      shutil.copy(source, os.path.join(root, "named", safe))
          PY
            else
              echo "::warning::xcresulttool export attachments failed; the .xcresult bundle is uploaded as is"
            fi
          fi
          cp ../../app/api-server.log . 2>/dev/null || true
          # The bundles hold thousands of files, some with names upload-artifact refuses: one zip each.
          for b in UITestResults.xcresult TestResults.xcresult; do
            if [ -d "$b" ]; then ditto -c -k --keepParent "$b" "$b.zip"; fi
          done
          echo "Attachments: $(ls ui-attachments/named | wc -l | tr -d ' '), host shots: $(ls ui-shots 2>/dev/null | wc -l | tr -d ' ')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            ios-native/App/ui-attachments/named
            ios-native/App/ui-attachments/manifest.json
            ios-native/App/ui-shots
            ios-native/App/api-server.log
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-xcresult
          path: |
            ios-native/App/UITestResults.xcresult.zip
            ios-native/App/TestResults.xcresult.zip
          retention-days: 7
          if-no-files-found: warn

  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen xcbeautify
      - name: Archive
        working-directory: ios-native/App
        env:
          API_URL: ${{ inputs.api_base_url || 'https://desktop-7gu8ukj.tail42feb1.ts.net:8443' }}
        run: |
          set -o pipefail
          xcodegen generate
          # dwarf-with-dsym is named here, not left to the project's Release preset: the dSYMs below are
          # the only way to read a MetricKit crash report from this IPA.
          xcodebuild -project LashKirja.xcodeproj -scheme LashKirja -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            API_BASE_URL="$API_URL" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee xcodebuild.log | xcbeautify --renderer github-actions
          # A Release IPA must talk to a real https server and carry a build number that names this run.
          PLIST=build/Build/Products/Release-iphoneos/LashKirja.app/Info.plist
          BASE=$(/usr/libexec/PlistBuddy -c "Print :LKAPIBaseURL" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "API base: $BASE, build: $BUILD"
          case "$BASE" in
            https://localhost*|https://127.*|https://0.0.0.0*|https://*.local*|https://invalid*) echo "::error::API base '$BASE' is a local or placeholder host"; exit 1 ;;
            https://*) ;;
            *) echo "::error::API base '$BASE' is not https"; exit 1 ;;
          esac
          [ "$BUILD" = "${{ github.run_number }}" ] || { echo "::error::CFBundleVersion '$BUILD' is not the run number"; exit 1; }
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/LashKirja.app Payload/
          zip -qry LashKirja-native-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LashKirja-native-unsigned-ipa
          path: ios-native/App/LashKirja-native-unsigned.ipa
          retention-days: 30
      # MetricKit reports name the binary and an offset; these bundles turn them into symbols. They match
      # only this run's build (same UUIDs), so they are kept per run, beside its IPA, and longer: a build
      # stays installed after its IPA artifact has expired.
      - name: Collect dSYMs
        working-directory: ios-native/App
        run: |
          set -eu
          PRODUCTS=build/Build/Products/Release-iphoneos
          rm -rf dsyms LashKirja-native-dsyms.zip
          mkdir dsyms
          # The app's and its frameworks' bundles (LashKirjaStripe); the Swift package is linked into the app's.
          for d in "$PRODUCTS"/*.dSYM; do
            if [ -d "$d" ]; then cp -R "$d" dsyms/; fi
          done
          echo "dSYMs: $(ls dsyms | tr '\n' ' ')"
          [ -n "$(ls dsyms)" ] || { echo "::error::No .dSYM bundle under $PRODUCTS: crash reports from this IPA could not be symbolicated"; exit 1; }
          [ -d dsyms/LashKirja.app.dSYM ] || { echo "::error::LashKirja.app.dSYM is missing: the app's own crashes could not be symbolicated"; exit 1; }
          # A dSYM that does not carry the IPA binary's UUID symbolicates nothing.
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PRODUCTS/LashKirja.app/Info.plist")
          APP_UUIDS=$(dwarfdump --uuid "$PRODUCTS/LashKirja.app/$EXEC" | awk '{print $2}' | sort)
          DSYM_UUIDS=$(dwarfdump --uuid dsyms/LashKirja.app.dSYM | awk '{print $2}' | sort)
          echo "App UUID: $APP_UUIDS, dSYM UUID: $DSYM_UUIDS"
          [ -n "$APP_UUIDS" ] && [ "$APP_UUIDS" = "$DSYM_UUIDS" ] || { echo "::error::LashKirja.app.dSYM does not match the app binary's UUID"; exit 1; }
          ditto -c -k dsyms LashKirja-native-dsyms.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LashKirja-native-dsyms
          path: ios-native/App/LashKirja-native-dsyms.zip
          retention-days: 90
          if-no-files-found: error
      # After the upload: the device build compiles what the simulator's skips, and a warning there must not cost the IPA.
      - name: No compiler warnings
        run: python3 scripts/compiler-warnings.py ios-native/App/xcodebuild.log
