name: iOS launch probe

# w56 (row 27): where the time before `main` goes on the CI simulator. Temporary evidence for the
# revoked-session gate: a blank SwiftUI app, the same with StripeTerminal linked, and LashKirja
# (Release-UITest), each launched plain (`simctl launch`) and by XCTest, plus a dyld load timeline.
on:
  push:
    branches: ["fix/w49-revoked-session"]
    paths: [".github/workflows/ios-launch-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Simulator
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c 'import sys,json
          d=json.load(sys.stdin)["devices"]
          ids=[x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(ids[0] if ids else "")')
          echo "SIM_UDID=$DEST" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEST" || true
          xcrun simctl bootstatus "$DEST" -b
      - name: Probe project
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/probe"; mkdir -p "$P/Blank" "$P/ProbeUITests"
          cat > "$P/project.yml" <<'YML'
          name: Probe
          options: { bundleIdPrefix: fi.tiyouba.probe, deploymentTarget: { iOS: "18.0" } }
          settings:
            base: { SWIFT_VERSION: "5.0", GENERATE_INFOPLIST_FILE: "YES", ENABLE_DEBUG_DYLIB: "NO", ONLY_ACTIVE_ARCH: "YES", INFOPLIST_KEY_UILaunchScreen_Generation: "YES" }
          packages:
            StripeTerminal: { url: https://github.com/stripe/stripe-terminal-ios-spm, from: 5.8.0 }
          targets:
            Blank:
              type: application
              platform: iOS
              sources: [Blank]
              settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: fi.tiyouba.probe.blank } }
            BlankStripe:
              type: application
              platform: iOS
              sources: [Blank]
              settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: fi.tiyouba.probe.blankstripe, SWIFT_ACTIVE_COMPILATION_CONDITIONS: STRIPE } }
              dependencies: [{ package: StripeTerminal, product: StripeTerminal }]
            ProbeUITests:
              type: bundle.ui-testing
              platform: iOS
              sources: [ProbeUITests]
              dependencies: [{ target: Blank }]
          schemes:
            Probe:
              build: { targets: { Blank: all, BlankStripe: all, ProbeUITests: [test] } }
              test: { config: Release, targets: [ProbeUITests] }
            ProbeNoChecks:
              build: { targets: { Blank: all, BlankStripe: all, ProbeUITests: [test] } }
              test: { config: Release, targets: [ProbeUITests], disableMainThreadChecker: true }
          YML
          cat > "$P/Blank/App.swift" <<'SWIFT'
          import SwiftUI
          import MachO
          #if STRIPE
          import StripeTerminal
          #endif

          func processAgeMs() -> Int {
              var info = kinfo_proc(); var size = MemoryLayout<kinfo_proc>.size
              var mib: [Int32] = [CTL_KERN, KERN_PROC, KERN_PROC_PID, getpid()]
              guard sysctl(&mib, u_int(mib.count), &info, &size, nil, 0) == 0 else { return -1 }
              let s = info.kp_proc.p_un.__p_starttime
              return Int((Date().timeIntervalSince1970 - (Double(s.tv_sec) + Double(s.tv_usec) / 1_000_000)) * 1000)
          }
          var timeline: [String] = []
          func mark(_ m: String) { timeline.append("\(m)=\(processAgeMs())"); print("LKMARK \(timeline.last!)") }

          @main
          struct BlankApp: App {
              init() {
                  mark("main")
                  #if STRIPE
                  if CommandLine.arguments.count > 1000 { _ = Terminal.isInitialized() }
                  #endif
                  let inserted = ProcessInfo.processInfo.environment["DYLD_INSERT_LIBRARIES"] ?? "-"
                  print("LKENV images=\(_dyld_image_count()) inserted=\(inserted)")
              }
              var body: some Scene {
                  WindowGroup {
                      Text("probe").onAppear { mark("appear") }
                          .accessibilityIdentifier("lk.launch-phase")
                          .accessibilityLabel(timeline.joined(separator: " "))
                  }
              }
          }
          SWIFT
          cat > "$P/ProbeUITests/ProbeTests.swift" <<'SWIFT'
          import XCTest

          final class ProbeTests: XCTestCase {
              func run(_ bundle: String, _ args: [String], wait: String?) {
                  let app = XCUIApplication(bundleIdentifier: bundle)
                  app.launchArguments = args
                  for round in 1...4 {
                      app.terminate(); sleep(2)
                      app.launch()
                      let pred = wait.map { NSPredicate(format: "identifier == 'lk.launch-phase' AND value == %@", $0) }
                          ?? NSPredicate(format: "identifier == 'lk.launch-phase'")
                      let el = app.descendants(matching: .any).matching(pred).firstMatch
                      _ = el.waitForExistence(timeout: 20)
                      sleep(1)
                      print("PROBE xctest \(bundle) round \(round): \(el.exists ? el.label : "?")")
                  }
                  app.terminate()
              }
              func test1_blank() { run("fi.tiyouba.probe.blank", [], wait: nil) }
              func test2_blankStripe() { run("fi.tiyouba.probe.blankstripe", [], wait: nil) }
              func test3_lashkirja() { run("fi.tiyouba.lashkirja", ["-LKLaunchPhase"], wait: "signedOut") }
          }
          SWIFT
          cd "$P" && xcodegen generate
      - name: Build
        run: |
          set -euo pipefail
          (cd ios-native/App && xcodegen generate && xcodebuild build -project LashKirja.xcodeproj -scheme LashKirja \
            -configuration Release-UITest -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd-app" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO API_BASE_URL=http://127.0.0.1:3999 -quiet)
          (cd "$RUNNER_TEMP/probe" && xcodebuild build-for-testing -project Probe.xcodeproj -scheme Probe -configuration Release \
            -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd-probe" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO -quiet)
          A="$RUNNER_TEMP/dd-app/Build/Products/Release-UITest-iphonesimulator/LashKirja.app"
          B="$RUNNER_TEMP/dd-probe/Build/Products/Release-iphonesimulator"
          echo "APP_A=$A" >> "$GITHUB_ENV"; echo "PROBE_B=$B" >> "$GITHUB_ENV"
          mkdir -p probe-out
          {
            echo "== sizes"; du -sh "$A" "$A"/LashKirja "$A"/Frameworks/* "$A"/*.car "$B"/Blank.app "$B"/BlankStripe.app 2>/dev/null
            ls "$A"; ls "$A"/Frameworks || true
            echo "== otool -L LashKirja"; otool -L "$A/LashKirja"
            echo "== StripeTerminal binary"; f=$(ls -d "$A"/Frameworks/StripeTerminal.framework/StripeTerminal 2>/dev/null || true)
            [ -n "$f" ] && { file "$f"; otool -l "$f" | grep -A3 LC_ID_DYLIB | head -4; otool -ov "$f" 2>/dev/null | grep -c '^    name ' || true; nm -m "$f" 2>/dev/null | grep -c '+\[.* load\]' || true; }
            echo "== static initializers (mod_init_func)"; for f in "$A/LashKirja" $(ls "$A"/Frameworks/*.framework/* 2>/dev/null | grep -v '\.'); do echo "$f: $(otool -s __DATA __mod_init_func "$f" 2>/dev/null | tail -n +3 | wc -w) words; init_offsets $(otool -s __TEXT __init_offsets "$f" 2>/dev/null | tail -n +3 | wc -w)"; done
            echo "== +load in LashKirja"; nm -m "$A/LashKirja" | grep -c ' load\]' || true
          } 2>&1 | tee probe-out/sizes.txt
      - name: Plain launches
        run: |
          set -u
          xcrun simctl install "$SIM_UDID" "$APP_A"
          xcrun simctl install "$SIM_UDID" "$PROBE_B/Blank.app"
          xcrun simctl install "$SIM_UDID" "$PROBE_B/BlankStripe.app"
          for id in fi.tiyouba.probe.blank fi.tiyouba.probe.blankstripe fi.tiyouba.lashkirja; do
            for i in 1 2 3 4 5 6; do
              xcrun simctl terminate "$SIM_UDID" $id 2>/dev/null || true
              sleep 2
              xcrun simctl launch --console-pty "$SIM_UDID" $id -LKLaunchPhase > probe-out/plain-$id-$i.txt 2>&1 &
              pid=$!; sleep 6; kill $pid 2>/dev/null || true
              echo "PROBE plain $id $i: $(grep -o 'LKMARK [a-zA-Z]*=[0-9-]*' probe-out/plain-$id-$i.txt | cut -d' ' -f2 | tr '\n' ' ') $(grep -o 'LKENV.*' probe-out/plain-$id-$i.txt | head -1)" | tee -a probe-out/summary.txt
            done
          done
          # dyld's own trace, each line stamped on arrival (ms after the launch command).
          for id in fi.tiyouba.probe.blank fi.tiyouba.lashkirja; do
            xcrun simctl terminate "$SIM_UDID" $id 2>/dev/null || true; sleep 2
            t0=$(perl -MTime::HiRes=time -e 'printf "%.3f", time')
            SIMCTL_CHILD_DYLD_PRINT_LIBRARIES=1 SIMCTL_CHILD_DYLD_PRINT_INITIALIZERS=1 \
              xcrun simctl launch --console-pty "$SIM_UDID" $id -LKLaunchPhase 2>&1 \
              | perl -MTime::HiRes=time -ne "BEGIN{\$|=1} printf \"%7.1f %s\", (time-$t0)*1000, \$_" > probe-out/dyld-$id.txt &
            pid=$!; sleep 8; kill $pid 2>/dev/null || true
            echo "== dyld $id: $(grep -c 'dyld\[' probe-out/dyld-$id.txt) lines; first/last:"; grep -m1 'dyld\[' probe-out/dyld-$id.txt; grep 'dyld\[' probe-out/dyld-$id.txt | tail -1; grep LKMARK probe-out/dyld-$id.txt
            # The largest gaps between consecutive lines: where loading stalls.
            awk '{t=$1; if (NR>1) printf "%7.1f gap before: %s\n", t-p, $0; p=t}' probe-out/dyld-$id.txt | sort -rn | head -12
          done 2>&1 | tee -a probe-out/summary.txt
      - name: XCTest launches
        run: |
          set -u
          for scheme in Probe ProbeNoChecks; do
            (cd "$RUNNER_TEMP/probe" && xcodebuild test-without-building -project Probe.xcodeproj -scheme $scheme -configuration Release \
              -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd-probe" 2>&1) | grep -E 'PROBE|Executed|error' | sed "s/^/[$scheme] /" | tee -a probe-out/summary.txt
          done
      - name: Summary
        if: always()
        run: grep -h PROBE probe-out/summary.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-probe
          path: probe-out
