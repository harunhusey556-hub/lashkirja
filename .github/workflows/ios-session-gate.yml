name: iOS revoked-session launch

# w49 (row 27): how long a revoked stored session takes from launch to the sign-in screen
# (StabilityTests.test10, three launches per variant). "before" is this branch with the session
# fix taken out (AppModel.swift and APIClient.swift as on native), keeping the test and the launch
# marker's clock, so both variants are measured the same way against the same demo API.
on:
  push:
    branches: ["fix/w49-revoked-session"]
    paths: [".github/workflows/ios-session-gate.yml", "ios-native/**"]
  workflow_dispatch:

jobs:
  walk:
    name: Revoked session (before / after)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tools
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Demo API
        working-directory: app
        env:
          DATABASE_URL: "file:${{ github.workspace }}/app/session-demo.db"
          SESSION_SECRET: "ci-only-secret-not-used-anywhere-real-32plus"
          CLOUD_AI_ENABLED: "false"
          ENABLEBANKING_ENABLED: "false"
          MAIL_TRANSPORT: "json"
        run: |
          set -euo pipefail
          npm ci
          npx prisma generate
          rm -f session-demo.db
          npx prisma migrate deploy
          npx tsx scripts/demo-seed.ts --ci
          npm run build
          nohup npx next start -H 127.0.0.1 -p 3999 > api-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null "http://127.0.0.1:3999/login"; then break; fi
            sleep 1
          done
          curl -s -o /dev/null -w "GET /login -> %{http_code}\n" "http://127.0.0.1:3999/login"
          # A refused token on a fresh production build (`next start`, as after a deploy): the first
          # answer shows what a cold server adds to the launch's verdict, before the warm-up below.
          for i in 1 2 3; do
            curl -s -o /dev/null -w "GET /api/auth/me (refused token) #$i -> %{http_code} %{time_total}s\n" \
              -H "authorization: Bearer not-a-session" "http://127.0.0.1:3999/api/auth/me"
          done
          # Every route warm before either variant: a cold route's first answer is not the app's time.
          bash ../scripts/sim/warm-api.sh | tail -3
      - name: Simulator
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c 'import sys,json
          d=json.load(sys.stdin)["devices"]
          ids=[x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(ids[0] if ids else "")')
          echo "Simulator: $DEST"
          echo "SIM_UDID=$DEST" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEST" || true
          xcrun simctl bootstatus "$DEST" -b
      - name: Walk after and before
        run: |
          set -u
          BASE=$(git merge-base HEAD origin/native)
          echo "before = this branch with AppModel.swift and APIClient.swift from $BASE"
          git worktree add --detach "$RUNNER_TEMP/before" HEAD
          git -C "$RUNNER_TEMP/before" checkout "$BASE" -- ios-native/App/Sources/AppModel.swift \
            ios-native/LashKirjaCore/Sources/LashKirjaCore/Net/APIClient.swift
          # The App's init starts the fix's early session check; the launch timeline marks stay.
          sed -i '' '/app.checkStoredSession()/d' "$RUNNER_TEMP/before/ios-native/App/Sources/LashKirjaApp.swift"
          # A fresh simulator's first walk hangs on its first UI snapshots (WalkTestCase.probe): a
          # throwaway warm-up pass first, so neither measured variant is the first on this simulator.
          for variant in warmup before after; do
            if [ "$variant" = before ]; then src="$RUNNER_TEMP/before"; else src="$GITHUB_WORKSPACE"; fi
            dd=$([ "$variant" = before ] && echo before || echo after)
            out="$GITHUB_WORKSPACE/build-session/$variant"
            mkdir -p "$out"
            # Every variant starts installed fresh and signed out.
            xcrun simctl uninstall "$SIM_UDID" fi.tiyouba.lashkirja || true
            xcrun simctl keychain "$SIM_UDID" reset || true
            (cd "$src/ios-native/App" && xcodegen generate)
            (cd "$src/ios-native/App" && set -o pipefail && TEST_RUNNER_LK_SHOT_DIR="$out" xcodebuild test \
              -project LashKirja.xcodeproj -scheme LashKirja-UITests -destination "id=$SIM_UDID" \
              -derivedDataPath "$RUNNER_TEMP/dd-$dd" -only-testing:LashKirjaUITests/StabilityTests/test10_RevokedSessionReachesSignInFast \
              -resultBundlePath "$out/result.xcresult" \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
              API_BASE_URL=http://127.0.0.1:3999 | xcbeautify --renderer github-actions) \
              && echo "PASS" > "$out/status" || echo "FAIL" > "$out/status"
            echo "== $variant: $(cat "$out/status")"
            grep MARK "$out/notes.txt" || true
          done
          # The fixed build again, launched by `simctl launch` instead of XCTest: how much of the time
          # before `main` is the test harness's. Launch 1 has a revoked session, 2–3 none (signed out).
          B=http://127.0.0.1:3999
          tok=$(curl -s -X POST "$B/api/auth/token" -H 'content-type: application/json' \
            -d '{"email":"demo@lashkirja.fi","password":"demo123"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          for id in $(curl -s -H "authorization: Bearer $tok" "$B/api/auth/sessions" | python3 -c 'import json,sys
          for s in json.load(sys.stdin)["sessions"]:
              if s.get("label") == "iPhone · LashKirja-sovellus" and not s.get("current"): print(s["id"])'); do
            curl -s -o /dev/null -X POST -H "authorization: Bearer $tok" -H 'content-type: application/json' \
              -d "{\"id\":\"$id\"}" "$B/api/auth/sessions"
          done
          for i in 1 2 3; do
            xcrun simctl terminate "$SIM_UDID" fi.tiyouba.lashkirja || true
            sleep 2
            xcrun simctl launch --console-pty "$SIM_UDID" fi.tiyouba.lashkirja -LKLaunchPhase > "build-session/plain-$i.txt" 2>&1 &
            pid=$!; sleep 8; kill $pid 2>/dev/null || true
            echo "MARK plain launch $i: $(grep -o 'LKMARK [a-zA-Z]*=[0-9-]*' "build-session/plain-$i.txt" | cut -d' ' -f2 | tr '\n' ' ')" | tee -a build-session/plain.txt
          done
          { for v in before after; do echo "## $v ($(cat build-session/$v/status))"; echo '```'; grep MARK "build-session/$v/notes.txt" || true; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY"
          # The job's verdict is the fixed variant's.
          [ "$(cat build-session/after/status)" = PASS ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revoked-session
          path: |
            build-session
            app/api-server.log
