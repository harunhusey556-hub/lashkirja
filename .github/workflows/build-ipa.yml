name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS API base URL baked into the bundled UI (NEXT_PUBLIC_API_BASE_URL)"
        required: true
        type: string

permissions:
  contents: read

env:
  # Throwaway values, matching ci.yml: the mobile export runs a production
  # `next build` (BUILD_TARGET=mobile), and src/lib/session.ts refuses to
  # load in production without a >=32 char SESSION_SECRET.
  DATABASE_URL: "file:./ci-check.db"
  SESSION_SECRET: "ci-only-secret-not-used-anywhere-real-32plus"
  CLOUD_AI_ENABLED: "false"

jobs:
  build:
    name: Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # The generated client is gitignored (src/generated/prisma). The mobile
      # export runs a real `next build`, which type-checks the whole
      # project, including route handlers that import the generated client
      # (pageExtensions hides them from the *bundle*, not from typecheck).
      - name: Generate Prisma client
        working-directory: app
        run: npx prisma generate

      - name: Build the mobile static export
        working-directory: app
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          case "$API_BASE_URL" in
            https://*) ;;
            *)
              echo "api_base_url must be an https:// URL"
              exit 1
              ;;
          esac
          npm run build:mobile -- --api-base-url "$API_BASE_URL"

      # The simulator autopilot (ios-sim-check.yml) is compiled in only with
      # NEXT_PUBLIC_CI_AUTOPILOT=1; a device IPA must never contain it.
      - name: Assert the CI autopilot is absent
        working-directory: app
        run: |
          if grep -rlF "LASHKIRJA_CI_AUTOPILOT" out; then
            echo "The CI simulator autopilot is compiled into the device export"
            exit 1
          fi
          if grep -F -q "127.0.0.1:3999" out/index.html; then
            echo "The CI step server origin is in the device CSP"
            exit 1
          fi
          echo "CI autopilot absent from the device export"

      - name: Sync Capacitor iOS project
        working-directory: app
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          npx cap sync ios
          if grep -q '"url"' ios/App/App/capacitor.config.json; then
            echo "capacitor.config.json still has a server.url key; the bundled build must not load a remote WebView server"
            exit 1
          fi
          test -f ios/App/App/public/index.html
          test -d ios/App/App/public/_next/static
          if ! grep -rF -q "$API_BASE_URL" ios/App/App/public/_next/static; then
            echo "API base URL '$API_BASE_URL' was not found baked into the bundled JS"
            exit 1
          fi
          npx tsx scripts/patch-ios-url-scheme.ts
          grep -F -q "<string>lashkirja</string>" ios/App/App/Info.plist
          if grep -rq "Tilikirja" ios/App/App/Info.plist ios/App/App/public/index.html; then
            echo "The old app name 'Tilikirja' is still present in user-visible native config"
            exit 1
          fi

      # OWN-21 passkeys: the associated domain must be the API host (the
      # server's WEBAUTHN_RP_ID). The unsigned build below ignores the
      # entitlements (CODE_SIGN_ENTITLEMENTS=""); the file is carried into the
      # package step and the artifact so a re-signer can apply it.
      - name: Point the passkey entitlement at the API host
        working-directory: app
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          host="$(printf '%s' "$API_BASE_URL" | sed -E 's#^https://([^/:]+).*$#\1#')"
          if ! printf '%s' "$host" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "Could not read a host name from api_base_url"
            exit 1
          fi
          sed -i '' -E "s#<string>webcredentials:[^<]*</string>#<string>webcredentials:${host}</string>#" ios/App/App/App.entitlements
          plutil -lint ios/App/App/App.entitlements
          grep -F "webcredentials:${host}" ios/App/App/App.entitlements

      - name: Build unsigned app
        working-directory: app
        run: |
          # Capacitor SPM has ios/App/App.xcodeproj only. App.xcworkspace is a CocoaPods artifact and is not in this repo.
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-unsigned \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        working-directory: app
        run: |
          APP="build/ios-unsigned/Build/Products/Release-iphoneos/App.app"
          if [[ ! -d "$APP" ]]; then
            echo "Build product not found at $APP"
            find build/ios-unsigned/Build/Products -name '*.app' -type d || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # Passkeys (OWN-21): embed the associated-domains entitlement with an
          # ad-hoc ("-") signature, so a re-signer that keeps the app's own
          # entitlements has it. Fail-soft: on any error the bundle is put back
          # exactly as built and the IPA is packaged unsigned as before.
          ENT="ios/App/App/App.entitlements"
          cp -R Payload/App.app adhoc-backup.app
          adhoc_ok=1
          if [[ -d Payload/App.app/Frameworks ]]; then
            while IFS= read -r -d '' nested; do
              codesign --force --sign - "$nested" || adhoc_ok=0
            done < <(find Payload/App.app/Frameworks -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0)
          fi
          if [[ "$adhoc_ok" == 1 ]] \
            && codesign --force --sign - --entitlements "$ENT" Payload/App.app \
            && codesign -d --entitlements - Payload/App.app 2>/dev/null | grep -q "webcredentials:"; then
            echo "Associated-domains entitlement embedded (ad-hoc signature; re-sign before install)"
          else
            echo "::warning::Could not embed the passkey entitlement; packaging the plain unsigned app"
            rm -rf Payload/App.app
            mv adhoc-backup.app Payload/App.app
          fi
          rm -rf adhoc-backup.app
          zip -qry LashKirja-unsigned.ipa Payload
          rm -rf Payload
          # A remote-URL shell was about 1 MB; the bundled UI must be
          # noticeably larger, or the export did not actually land in the IPA.
          size_bytes=$(stat -f%z LashKirja-unsigned.ipa)
          size_human=$(du -h LashKirja-unsigned.ipa | cut -f1)
          echo "Size: $size_human ($size_bytes bytes)"
          min_bytes=$((2 * 1024 * 1024))
          if [[ "$size_bytes" -lt "$min_bytes" ]]; then
            echo "IPA is smaller than 2 MB; the bundled UI export is probably missing"
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LashKirja-unsigned-ipa
          # App.entitlements rides along for re-signers that take an
          # entitlements file (docs/PASSKEY.md).
          path: |
            app/LashKirja-unsigned.ipa
            app/ios/App/App/App.entitlements
          retention-days: 30
          if-no-files-found: error
