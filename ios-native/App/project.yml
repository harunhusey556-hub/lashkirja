name: LashKirja
options:
  developmentLanguage: fi
  bundleIdPrefix: fi.tiyouba
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
# Debug and Release stay unsigned (CI, the unsigned IPA). Release-Signed is the owner's own signed
# build with the Tap to Pay entitlement; only it references the entitlements file, because a
# free-account re-sign of the unsigned IPA would fail on an entitlement it cannot grant.
configs:
  Debug: debug
  Release: release
  Release-Signed: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    API_BASE_URL: "https://desktop-7gu8ukj.tail42feb1.ts.net:8443"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    # "YES" only in the signed build: the app reads it (Info.plist LKTapToPayEntitlement) to say
    # whether this install can take Tap to Pay payments at all.
    LK_TAP_TO_PAY_ENTITLEMENT: "NO"
packages:
  LashKirjaCore:
    path: ../LashKirjaCore
  # Stripe Terminal (Tap to Pay on iPhone), App target only; Core stays plain Foundation.
  StripeTerminal:
    url: https://github.com/stripe/stripe-terminal-ios-spm
    from: 5.8.0
targets:
  LashKirja:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: LashKirja
        # The app is Finnish only: system-drawn controls (PasteButton "Liitä", Done, Cancel,
        # the text-edit menu) follow these instead of falling back to English.
        CFBundleDevelopmentRegion: fi
        CFBundleLocalizations: [fi]
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LKAPIBaseURL: $(API_BASE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Kameralla kuvaat kuitit kirjanpitoon."
        NSPhotoLibraryUsageDescription: "Valitse kuitin kuva kirjastosta."
        NSFaceIDUsageDescription: "Face ID avaa sovelluksen lukituksen."
        # Stripe Terminal needs the location to accept a card payment (Tap to Pay).
        NSLocationWhenInUseUsageDescription: "Sijaintia tarvitaan korttimaksuissa: Stripe vaatii maksupaikan tiedon jokaiseen Tap to Pay -maksuun."
        # The Stripe SDK links Bluetooth for external readers; v1 uses none (no bluetooth background mode).
        NSBluetoothAlwaysUsageDescription: "Bluetoothia käytetään vain, jos yhdistät erillisen Stripe-kortinlukijan."
        LKTapToPayEntitlement: $(LK_TAP_TO_PAY_ENTITLEMENT)
        # Local notifications fed by Background App Refresh (no push: the app is signed with a
        # free account). Info.plist keys only; no entitlement is needed. The identifier must match
        # AppNotifications.refreshTaskId.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [fi.tiyouba.lashkirja.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: fi.tiyouba.lashkirja
            CFBundleURLSchemes: [lashkirja]
        # Home Screen quick actions; the types must match QuickAction.shortcutType in Core.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: fi.tiyouba.lashkirja.capture
            UIApplicationShortcutItemTitle: Kuvaa kuitti
            UIApplicationShortcutItemIconSymbolName: camera
          - UIApplicationShortcutItemType: fi.tiyouba.lashkirja.newInvoice
            UIApplicationShortcutItemTitle: Uusi lasku
            UIApplicationShortcutItemIconSymbolName: doc.badge.plus
          - UIApplicationShortcutItemType: fi.tiyouba.lashkirja.assistant
            UIApplicationShortcutItemTitle: Avustaja
            UIApplicationShortcutItemIconSymbolName: bubble.left
        # "Avaa sähköposti" on the code screens opens Gmail when canOpenURL says it is installed.
        LSApplicationQueriesSchemes: [googlegmail]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.tiyouba.lashkirja
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # The owner's signed Tap to Pay build. Needs a paid Apple Developer account with the
        # Tap to Pay on iPhone entitlement granted; set DEVELOPMENT_TEAM here (or pass
        # DEVELOPMENT_TEAM=XXXXXXXXXX to xcodebuild) before building scheme LashKirja-TapToPay.
        Release-Signed:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_ENTITLEMENTS: Config/LashKirja-TapToPay.entitlements
          LK_TAP_TO_PAY_ENTITLEMENT: "YES"
    dependencies:
      - package: LashKirjaCore
      - package: StripeTerminal
        product: StripeTerminal
  LashKirjaAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/LashKirjaAppTests]
    dependencies:
      - target: LashKirja
  # Simulator walk against a throwaway demo server (scripts/sim/run-ui.sh). Not in the LashKirja
  # scheme: it needs that server, so CI does not run it.
  LashKirjaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/LashKirjaUITests]
    settings: { base: { GENERATE_INFOPLIST_FILE: "YES" } }
    dependencies:
      - target: LashKirja
schemes:
  LashKirja-UITests:
    build: { targets: { LashKirja: all, LashKirjaUITests: [test] } }
    test: { config: Debug, targets: [LashKirjaUITests] }
  # Unsigned, as CI and the IPA build it.
  LashKirja:
    build: { targets: { LashKirja: all } }
    run: { config: Debug }
    test: { config: Debug, targets: [LashKirjaAppTests] }
    profile: { config: Release }
    analyze: { config: Debug }
    archive: { config: Release }
  # Signed with the Tap to Pay entitlement (Release-Signed); run on a device from Xcode.
  LashKirja-TapToPay:
    build: { targets: { LashKirja: all } }
    run: { config: Release-Signed }
    profile: { config: Release-Signed }
    analyze: { config: Release-Signed }
    archive: { config: Release-Signed }
